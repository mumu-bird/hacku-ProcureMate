
<template id="slide-cover"><section class="slide" data-density="editorial"><div class="deck-head"><span>ProcureMate</span><span>HacKU 2026 · FinTech 01</span></div><span class="kicker">可信授权，完整采购</span><div class="big-type" data-visual-event="oversized-number">ProcureMate</div><h1 style="white-space:pre-line">{{title}}</h1><p style="max-width:1050px">{{subtitle}}</p><div class="cover-mark" data-visual-event="signature-mark"><svg viewBox="0 0 100 100"><path d="M25 28L50 15L75 28L50 41Z M25 42L50 55L75 42 M25 57L50 70L75 57 M50 41V70"/><path d="M66 77l7 7 14-18"/></svg></div><div class="cover-stamp" data-visual-event="visual-plate">在预算内执行<br/>越过边界，停下</div><div class="deck-foot"><span>{{note}}</span><span>{{page-no}} / {{page-total}}</span></div></section></template>
<template id="slide-split"><section class="slide"><div class="deck-head"><span>ProcureMate</span><span>HacKU 2026 · FinTech 01</span></div><h2>{{title}}</h2><div class="split-stage"><div><p>{{body}}</p><div class="receipt" data-visual-event="visual-plate"><span>待验证的小团队采购问题</span><strong>金额变了，<br/>授权还成立吗？</strong><div class="seal">最终付款，也要符合原来的规则</div></div></div><div class="steps"><div class="step" data-visual-event="item-marker"><i>01</i><strong>{{a}}</strong></div><div class="step" data-visual-event="item-marker"><i>02</i><strong>{{b}}</strong></div><div class="step" data-visual-event="item-marker"><i>03</i><strong>{{c}}</strong></div></div></div><div class="deck-foot"><span>{{source}}</span><span>{{page-no}} / {{page-total}}</span></div></section></template>
<template id="slide-demo"><section class="slide"><div class="deck-head"><span>ProcureMate</span><span>HacKU 2026 · FinTech 01</span></div><h2>{{title}}</h2><div class="demo-stage"><div><p>{{body}}</p><div class="receipt" data-visual-event="visual-plate"><span>一笔交易 + 一次拦截</span><strong>付款没有发起</strong><div class="seal">具体规则可以在后端核对</div></div></div><div class="screen" data-visual-event="visual-plate">{{image:self-0}}</div></div><div class="deck-foot"><span>{{source}}</span><span>{{page-no}} / {{page-total}}</span></div></section></template>
<template id="slide-flow"><section class="slide"><div class="deck-head"><span>ProcureMate</span><span>HacKU 2026 · FinTech 01</span></div><h2>{{title}}</h2><p>{{body}}</p><div class="flow-stage" data-visual-event="visual-plate"><div class="flow-row"><div class="flow-node">需求与商品<small>规格、数量、价格来源</small></div><div class="flow-arrow">→</div><div class="flow-node">负责人授权<small>预算、商户、品类、期限</small></div><div class="flow-arrow">→</div><div class="flow-node">预算预留<small>数据库原子执行</small></div></div><div class="flow-row"><div class="flow-node">付款授权<small>支付渠道状态</small></div><div class="flow-arrow">→</div><div class="flow-node">再次复核<small>报价变更、到期、撤销</small></div><div class="flow-arrow">→</div><div class="flow-node">扣款与订单<small>查询结果、收货、库存</small></div></div></div><div class="trust-band" data-visual-event="visual-plate">模型负责选品，规则负责花钱。支付超时不盲目重试；退款不等于退货。</div><div class="deck-foot"><span>{{source}}</span><span>{{page-no}} / {{page-total}}</span></div></section></template>
<template id="slide-comparison"><section class="slide"><div class="deck-head"><span>ProcureMate</span><span>HacKU 2026 · FinTech 01</span></div><h2>{{title}}</h2><div class="comparison-stage">{{@table rows=rows cols=cols cells=cells}}</div><p class="source">现有产品已经具备采购控制能力。我们的轻量定位与使用价值，需要真实小公司试点验证。</p><div class="deck-foot"><span>{{source}}</span><span>{{page-no}} / {{page-total}}</span></div></section></template>
<template id="slide-proof"><section class="slide"><div class="deck-head"><span>ProcureMate</span><span>HacKU 2026 · FinTech 01</span></div><h2>{{title}}</h2><p>{{body}}</p><div class="proof-stage"><div class="proof-item" data-visual-event="oversized-number"><strong>21</strong><span>{{a}}</span></div><div class="proof-item" data-visual-event="oversized-number"><strong>3</strong><span>{{b}}</span></div><div class="proof-item" data-visual-event="oversized-number"><strong>16</strong><span>{{c}}</span></div></div><div class="trust-band">/study 已固定任务与来源，支持计时、错误及放弃记录。真人结果为零；模型与 Stripe 网络调用仍待凭证验证。</div><div class="deck-foot"><span>{{source}}</span><span>{{page-no}} / {{page-total}}</span></div></section></template>
<template id="slide-closing"><section class="slide" data-density="editorial"><div class="deck-head"><span>ProcureMate</span><span>HacKU 2026 · FinTech 01</span></div><span class="kicker">从比赛原型，到真实采购</span><h2>{{title}}</h2><p>{{body}}</p><div class="closing-list"><div class="closing-item" data-visual-event="item-marker"><b>01 / 验证</b><small>{{a}}</small></div><div class="closing-item" data-visual-event="item-marker"><b>02 / 接入</b><small>{{b}}</small></div><div class="closing-item" data-visual-event="item-marker"><b>03 / 试点</b><small>{{c}}</small></div></div><div class="signature" data-visual-event="signature-mark">让代理能办成事，也能在该停的时候停下。</div><div class="deck-foot"><span>{{source}}</span><span>{{page-no}} / {{page-total}}</span></div></section></template>
